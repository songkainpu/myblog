<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">MCP architecture</title><desc id="desc">Agent connects to a platform MCP server, which delegates to session, hierarchy, executor and capture components.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="1100" height="560" rx="20" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle"><g fill="#fff" stroke="#2563eb" stroke-width="3"><rect x="410" y="35" width="280" height="70" rx="14"/><rect x="390" y="155" width="320" height="70" rx="14"/></g><g fill="#eff6ff" stroke="#60a5fa" stroke-width="3"><rect x="90" y="365" width="190" height="70" rx="14"/><rect x="325" y="365" width="190" height="70" rx="14"/><rect x="560" y="365" width="190" height="70" rx="14"/><rect x="795" y="365" width="190" height="70" rx="14"/></g><g fill="#0f172a" font-size="22"><text x="550" y="78">Skill / Agent</text><text x="550" y="198">单平台 MCP Server</text><text x="185" y="408">SessionManager</text><text x="420" y="408">Hierarchy Adapter</text><text x="655" y="408">Action Executor</text><text x="890" y="408">Screen Capture</text></g><g stroke="#64748b" stroke-width="3" marker-end="url(#a)" fill="none"><path d="M550 105v45"/><path d="M550 225v75H185v65"/><path d="M550 225v140"/><path d="M550 225v75h340v65"/></g><g fill="#475569" font-size="18"><text x="185" y="485">连接与会话状态</text><text x="420" y="485">统一页面元素</text><text x="655" y="485">统一动作执行</text><text x="890" y="485">截图与证据</text></g></g></svg>
