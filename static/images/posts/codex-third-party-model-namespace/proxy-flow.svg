<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Codex 第三方模型代理链路</title>
  <desc id="desc">Codex Desktop 请求先经本地代理清理 namespace 和 external_web_access，再经公司网关发送给 DeepSeek。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#151934"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1440" height="560" rx="32" fill="url(#bg)"/>
  <text x="70" y="76" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="32" font-weight="700">请求转换链路</text>
  <path d="M286 280H1150" stroke="url(#line)" stroke-width="8" opacity=".9" marker-end="url(#arrow)" filter="url(#glow)"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(70 166)"><rect width="270" height="220" rx="26" fill="#142239" stroke="#22d3ee"/><circle cx="135" cy="70" r="30" fill="#0e7490"/><path d="M120 66h30M120 78h20" stroke="#cffafe" stroke-width="5" stroke-linecap="round"/><text x="135" y="132" fill="#f8fafc" font-size="24" font-weight="650">Codex Desktop</text><text x="135" y="169" fill="#94a3b8" font-size="17">namespace</text><text x="135" y="195" fill="#94a3b8" font-size="17">external_web_access</text></g>
    <g transform="translate(468 138)"><rect width="330" height="276" rx="30" fill="#102b2d" stroke="#2dd4bf" stroke-width="2"/><path d="M130 58h70l-20 38v44l-30 18v-62z" fill="none" stroke="#5eead4" stroke-width="7" stroke-linejoin="round"/><text x="165" y="194" fill="#f8fafc" font-size="25" font-weight="700">本地转换代理</text><text x="165" y="228" fill="#99f6e4" font-size="17">移除不兼容工具与字段</text><text x="165" y="254" fill="#94a3b8" font-size="16">127.0.0.1:8890</text></g>
    <g transform="translate(918 166)"><rect width="210" height="220" rx="26" fill="#22203a" stroke="#818cf8"/><path d="M64 62h82M64 82h82M64 102h82" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round"/><text x="105" y="150" fill="#f8fafc" font-size="23" font-weight="650">公司网关</text><text x="105" y="184" fill="#94a3b8" font-size="17">标准 function</text></g>
    <g transform="translate(1200 166)"><rect width="170" height="220" rx="26" fill="#2c2518" stroke="#fbbf24"/><circle cx="85" cy="74" r="36" fill="none" stroke="#fde68a" stroke-width="7"/><path d="M60 74h50M85 49v50" stroke="#fde68a" stroke-width="5"/><text x="85" y="150" fill="#f8fafc" font-size="23" font-weight="650">DeepSeek</text><text x="85" y="184" fill="#fde68a" font-size="17">请求通过</text></g>
  </g>
</svg>
