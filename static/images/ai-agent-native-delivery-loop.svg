<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">AI Native delivery loop</title><desc id="desc">Understand requirements, generate code, build app, operate UI, verify, and report or fix.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="1200" height="300" rx="20" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle"><g fill="#fff" stroke="#2563eb" stroke-width="3"><rect x="30" y="110" width="145" height="65" rx="12"/><rect x="205" y="110" width="155" height="65" rx="12"/><rect x="390" y="110" width="145" height="65" rx="12"/><rect x="565" y="110" width="170" height="65" rx="12"/><rect x="765" y="110" width="155" height="65" rx="12"/><rect x="950" y="110" width="180" height="65" rx="12"/></g><g fill="#0f172a" font-size="19"><text x="102" y="149">理解需求</text><text x="282" y="149">生成或修改代码</text><text x="462" y="149">构建并启动应用</text><text x="650" y="149">Agent 操作真实 UI</text><text x="842" y="149">验证功能与视觉</text><text x="1040" y="149">输出结果 / 继续修复</text></g><g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" fill="none"><path d="M175 142h30M360 142h30M535 142h30M735 142h30M920 142h30"/><path d="M1040 175v75H282v-75"/></g><text x="650" y="270" fill="#475569" font-size="18">验证未通过：回到代码修改</text></g></svg>
