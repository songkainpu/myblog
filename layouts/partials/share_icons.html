{{- $pageurl := .Permalink -}}
{{- $title := .Title -}}
{{- $dialogID := printf "wechat-share-%s" (.File.UniqueID | default "page") -}}

<div class="cn-share" aria-label="分享文章">
  <span class="cn-share__label">分享到</span>
  <button class="cn-share__button cn-share__button--wechat" type="button"
    aria-label="分享到微信" data-wechat-dialog="{{ $dialogID }}">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9.7 4.2c-4.2 0-7.6 2.7-7.6 6 0 1.9 1.1 3.6 2.9 4.7l-.7 2.2 2.6-1.3c.9.3 1.8.5 2.8.5h.4a5.6 5.6 0 0 1-.2-1.4c0-3.4 3.2-6.1 7.2-6.1h.1c-.8-2.7-3.8-4.6-7.5-4.6Zm-2.6 4a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm5.2 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/>
      <path d="M21.9 14.8c0-2.8-2.8-5.1-6.2-5.1s-6.2 2.3-6.2 5.1 2.8 5.1 6.2 5.1c.8 0 1.6-.1 2.3-.4l2.2 1.1-.6-1.9c1.4-.9 2.3-2.3 2.3-3.9Zm-8.2-1.1a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6Zm4.2 0a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6Z"/>
    </svg>
    <span>微信</span>
  </button>

  <a class="cn-share__button cn-share__button--qq" target="_blank" rel="noopener noreferrer"
    aria-label="分享到 QQ"
    href="https://connect.qq.com/widget/shareqq/index.html?url={{ $pageurl | urlquery }}&amp;title={{ $title | urlquery }}">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2.3c-3.8 0-6.4 3.1-6.4 7.4 0 .8.1 1.5.2 2.2-.9 1.3-1.5 2.8-1.5 3.8 0 .7.3 1.1.8 1.1.4 0 .8-.2 1.2-.6.7 1.7 2 3 3.6 3.6-.4.4-.7.9-.7 1.3 0 .6.5.8 1.2.6.5-.1 1-.4 1.6-.8.6.4 1.1.7 1.6.8.7.2 1.2 0 1.2-.6 0-.4-.3-.9-.7-1.3 1.6-.6 2.9-1.9 3.6-3.6.4.4.8.6 1.2.6.5 0 .8-.4.8-1.1 0-1-.6-2.5-1.5-3.8.1-.7.2-1.4.2-2.2 0-4.3-2.6-7.4-6.4-7.4Z"/>
    </svg>
    <span>QQ</span>
  </a>
</div>

<dialog class="wechat-share-dialog" id="{{ $dialogID }}">
  <button class="wechat-share-dialog__close" type="button" aria-label="关闭">×</button>
  <p class="wechat-share-dialog__eyebrow">微信分享</p>
  <h2>用微信扫一扫</h2>
  <div class="wechat-share-dialog__qr" data-share-url="{{ $pageurl }}">
    <span>正在生成二维码…</span>
  </div>
  <p class="wechat-share-dialog__hint">扫码后，在微信中打开并分享这篇文章</p>
  <button class="wechat-share-dialog__copy" type="button" data-copy-url="{{ $pageurl }}">复制文章链接</button>
</dialog>

<script>
(() => {
  const trigger = document.querySelector('[data-wechat-dialog="{{ $dialogID }}"]');
  const dialog = document.getElementById('{{ $dialogID }}');
  if (!trigger || !dialog) return;

  const closeButton = dialog.querySelector('.wechat-share-dialog__close');
  const copyButton = dialog.querySelector('[data-copy-url]');
  const qrContainer = dialog.querySelector('[data-share-url]');

  trigger.addEventListener('click', () => {
    if (!qrContainer.querySelector('img')) {
      const image = new Image();
      image.width = 220;
      image.height = 220;
      image.alt = '当前文章的微信分享二维码';
      image.src = `https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=12&data=${encodeURIComponent(qrContainer.dataset.shareUrl)}`;
      image.addEventListener('load', () => qrContainer.replaceChildren(image));
      image.addEventListener('error', () => {
        qrContainer.textContent = '二维码加载失败，请复制下方链接分享';
      });
    }
    dialog.showModal();
  });

  closeButton.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) dialog.close();
  });

  copyButton.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(copyButton.dataset.copyUrl);
      copyButton.textContent = '链接已复制';
      window.setTimeout(() => { copyButton.textContent = '复制文章链接'; }, 1600);
    } catch (_) {
      window.prompt('复制文章链接', copyButton.dataset.copyUrl);
    }
  });
})();
</script>
